{% extends 'base.html' %}

{% block title %}{% if object %}Edit{% else %}New{% endif %} Project{% endblock %}

{% block content %}
<div class="card">
    <h1>{% if object %}Edit{% else %}New{% endif %} Project</h1>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_name">Project Name</label>
            <input type="text" name="name" id="id_name" required value="{{ form.name.value|default:'' }}">
        </div>
        <div class="form-group">
            <label for="id_description">Description</label>
            <textarea name="description" id="id_description" rows="4">{{ form.description.value|default:'' }}</textarea>
        </div>
        <button type="submit" class="btn">Save Project</button>
        <a href="{% url 'project_list' %}" class="btn btn-danger">Cancel</a>
    </form>
</div>
{% endblock %}
