{% extends 'base.html' %}

{% block title %}{% if object %}Edit{% else %}New{% endif %} Task{% endblock %}

{% block content %}
<div class="card">
    <h1>{% if object %}Edit{% else %}New{% endif %} Task</h1>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_title">Title</label>
            <input type="text" name="title" id="id_title" required value="{{ form.title.value|default:'' }}">
        </div>
        <div class="form-group">
            <label for="id_description">Description</label>
            <textarea name="description" id="id_description" rows="4">{{ form.description.value|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label for="id_assignee">Assignee</label>
            {{ form.assignee }}
        </div>
        <div class="form-group">
            <label for="id_status">Status</label>
            {{ form.status }}
        </div>
        <div class="form-group">
            <label for="id_priority">Priority</label>
            {{ form.priority }}
        </div>
        <div class="form-group">
            <label for="id_due_date">Due Date</label>
            <input type="date" name="due_date" id="id_due_date" value="{{ form.due_date.value|default:'' }}">
        </div>
        <button type="submit" class="btn">Save Task</button>
        <a href="{% if object %}{% url 'project_detail' object.project.pk %}{% else %}{% url 'project_list' %}{% endif %}" class="btn btn-danger">Cancel</a>
    </form>
</div>
{% endblock %}
