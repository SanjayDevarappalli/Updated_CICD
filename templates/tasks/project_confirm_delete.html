{% extends 'base.html' %}

{% block title %}Delete Project{% endblock %}

{% block content %}
<div class="card">
    <h1>Delete Project</h1>
    <p>Are you sure you want to delete "{{ object.name }}"?</p>
    <p>This will also delete all tasks in this project.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'project_list' %}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
