name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          flake8 . --max-line-length=120 --extend-ignore=E203,W503

      - name: Check code formatting with Black
        run: |
          black --check . --exclude='migrations'

      - name: Run security checks with Bandit
        run: |
          bandit -r tasks/ myproject/ -f json -o bandit_report.json || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for unsafe dependencies
        run: |
          pip install safety
          safety check --json --output=safety_report.json || true

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run tests with pytest
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  deploy:
    name: Deploy to Local System
    needs: [lint, test]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput

      - name: Stop existing server
        run: |
          Get-Process -Name "python" -ErrorAction SilentlyContinue |
          Where-Object { $_.CommandLine -like "*manage.py runserver*" } |
          Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Start Django server
        run: |
          Start-Process -FilePath "python" -ArgumentList "manage.py runserver 0.0.0.0:8000" -WorkingDirectory "${{ github.workspace }}" -WindowStyle Hidden
          Start-Sleep -Seconds 3

      - name: Verify deployment
        run: |
          Write-Host "Deployment successful!"
          Write-Host "Application should be running at http://localhost:8000"
